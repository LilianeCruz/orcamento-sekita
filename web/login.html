<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Orçamento Sekita</title>
<link rel="stylesheet" href="/web/estilo.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; background: #f3f5f2; }
  .lg { width: min(92vw, 400px); background: #fff; border: 1px solid var(--borda); border-radius: 20px; box-shadow: 0 12px 30px rgba(14,60,40,.12); padding: 32px; }
  .lg img { display: block; height: 44px; margin: 0 auto 22px; }
  .lg h1 { margin: 0 0 18px; font-size: 20px; text-align: center; }
  .lg label { display: block; margin-bottom: 14px; font-size: 13.5px; color: var(--suave); }
  .lg input { width: 100%; margin-top: 6px; padding: 12px 14px; font: inherit; border: 1px solid var(--borda); border-radius: 10px; box-sizing: border-box; }
  .lg .prim { width: 100%; padding: 13px; margin-top: 4px; }
  .lg .link { display: block; margin: 14px auto 0; }
  #lg-msg { margin: 0 0 14px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  #lg-msg.erro { background: #fdecea; color: #a0301f; } #lg-msg.ok { background: #eaf5ee; color: #0e5c3f; }
</style>
</head>
<body>
<form class="lg" id="lg-form">
  <img src="/web/assets/logo-sekita.png" alt="Sekita">
  <h1>Entrar no sistema</h1>
  <p id="lg-msg" hidden></p>
  <label>E-mail<input type="email" id="lg-email" autocomplete="username" required></label>
  <label>Senha<input type="password" id="lg-senha" autocomplete="current-password" required></label>
  <button class="prim" type="submit" id="lg-ok">Entrar</button>
  <button class="link" type="button" id="lg-esqueci">Esqueci a senha</button>
</form>
<script src="/web/auth.js"></script>
<script src="/web/login.js"></script>
</body>
</html>
